name: project_marcus
description: "DedSec-style local network utility HUD (original assets, no game IP)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  battery_plus: ^6.1.0        # hardware battery status
  sensors_plus: ^6.1.0  # Captures real-time device orientation and heading
  flutter_vlc_player: ^7.4.1  # Core network stream decoding engine
  network_info_plus: ^6.1.0   # local wifi/IP interface info
  lan_scanner: ^3.1.0         # async subnet ping sweep
  flutter_blue_plus: ^1.34.0  # BLE RSSI radar scanning
  geolocator: ^13.0.0         # GPS coordinates for weather lookup
  http: ^1.3.0                # OSINT / weather REST calls
  permission_handler: ^11.3.1 # runtime permission requests (BLE/location)
  wifi_scan: ^0.4.0            # 802.11 RF spectrum scanning
  url_launcher: ^6.2.0          # open external URLs in browser
  multicast_dns: ^0.3.3         # mDNS service discovery for IoT devices
  dart_cast: ^0.5.1              # Chromecast CastV2 (TLS + protobuf)
  web_socket_channel: ^3.0.0     # LG WebOS WebSocket pairing
  shared_preferences: ^2.3.0     # persist LG client-key & ATV pairing secret
  pointycastle: ^3.9.1           # AES-ECB for Android TV Remote pairing
  crypto: ^3.0.7                 # SHA256 / HMAC for ATVRP pairing handshake
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.3.1
  asn1lib: ^1.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  # Drop your own DedSec-style art into assets/images and register it here.
  # This folder is intentionally left as a placeholder slot -- see README.md.
  assets:
    - assets/images/


flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_icon.png"
